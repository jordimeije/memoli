kind = "web"
previewPath = "/"
title = "Afhaal Centrum Memoli"
description = "De publieke bestelwebsite van Afhaal Centrum Memoli in Hengelo. Klanten bekijken het Turkse menu, vullen een winkelwagen en plaatsen een afhaalbestelling. Bevat ook een beheerpaneel voor live bestellingen, wachttijd, openingstijden en open/gesloten-status."
version = "1.0.0"
id = "artifacts/memoli-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20722

[services.development]
run = "pnpm --filter @workspace/memoli-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memoli-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/memoli-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20722"
BASE_PATH = "/"
